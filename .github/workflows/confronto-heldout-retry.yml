name: Ministral - sola prova nuova con margine di scaricamento
on:
  push:
    branches: [experiment/confronto-modelli-locali]
    paths: [.github/workflows/confronto-heldout-retry.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COMPARE: python -u tools/compare_local_models.py --manifest tests/fixtures/local_model_assets.json --fresh tests/fixtures/local_model_fresh_cases.json --model ministral_3_14b_reasoning_2512 --profile heldout128 --assets .comparison-assets --output comparison-artifacts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test del contratto senza pesi
        run: python -S -m unittest discover -s tests -p test_compare_local_models.py -v
      - name: Solo tokenizer canonico Mistral
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check mistral-common==1.12.0
      - name: Prepara asset con margine di dieci minuti
        timeout-minutes: 10
        run: $COMPARE --prepare
      - name: Parte 1 - due casi nuovi
        timeout-minutes: 4
        run: $COMPARE --part 1
      - name: Parte 2 - due casi nuovi
        timeout-minutes: 4
        run: $COMPARE --part 2
      - name: Parte 3 - due casi nuovi
        timeout-minutes: 4
        run: $COMPARE --part 3
      - name: Parte 4 - due casi nuovi
        timeout-minutes: 4
        run: $COMPARE --part 4
      - name: Parte 5 - due casi nuovi
        timeout-minutes: 4
        run: $COMPARE --part 5
      - name: Parte 6 - due casi nuovi
        timeout-minutes: 4
        run: $COMPARE --part 6
      - name: Parte 7 - due casi nuovi
        timeout-minutes: 4
        run: $COMPARE --part 7
      - name: Aggrega anche risultati parziali
        if: always()
        run: $COMPARE --aggregate
      - name: Conserva prove effettive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ministral-heldout128-retry-${{ github.run_attempt }}
          path: comparison-artifacts/
          retention-days: 14
          if-no-files-found: error
