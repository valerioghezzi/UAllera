name: Confronto modelli locali - dati artificiali
on:
  push:
    branches: [experiment/confronto-modelli-locali]
    paths:
      - tools/compare_local_models.py
      - tests/test_compare_local_models.py
      - tests/fixtures/local_model_assets.json
      - tests/fixtures/local_model_fresh_cases.json
      - .github/workflows/confronto-modelli.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    name: Prova ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: qwen3_8_27b
            profile: budget128
            minutes: 105
          - model: ministral_3_14b_reasoning_2512
            profile: heldout128
            minutes: 35
          - model: qwen3_5_9b
            profile: budget128
            minutes: 105
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      TOKENIZERS_PARALLELISM: 'false'
      COMPARE: python -u tools/compare_local_models.py --manifest tests/fixtures/local_model_assets.json --fresh tests/fixtures/local_model_fresh_cases.json --model ${{ matrix.model }} --assets .comparison-assets --output comparison-artifacts --profile ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test del contratto di confronto senza pesi
        run: python -S -m unittest discover -s tests -p test_compare_local_models.py -v
      - name: Tokenizer ufficiali senza framework di inferenza
        timeout-minutes: 3
        run: python -m pip install --disable-pip-version-check transformers==5.20.2 mistral-common==1.12.0 jinja2==3.1.6
      - name: Prepara modello e motore con hash fissati
        id: prepare
        timeout-minutes: 7
        run: $COMPARE --prepare
      - name: Parte 1 - corpus previsto dal profilo
        if: ${{ success() }}
        timeout-minutes: 14
        run: $COMPARE --part 1
      - name: Parte 2 - corpus previsto dal profilo
        if: ${{ success() }}
        timeout-minutes: 14
        run: $COMPARE --part 2
      - name: Parte 3 - corpus previsto dal profilo
        if: ${{ success() }}
        timeout-minutes: 14
        run: $COMPARE --part 3
      - name: Parte 4 - corpus previsto dal profilo
        if: ${{ success() }}
        timeout-minutes: 14
        run: $COMPARE --part 4
      - name: Parte 5 - corpus previsto dal profilo
        if: ${{ success() }}
        timeout-minutes: 14
        run: $COMPARE --part 5
      - name: Parte 6 - corpus previsto dal profilo
        if: ${{ success() }}
        timeout-minutes: 14
        run: $COMPARE --part 6
      - name: Parte 7 - corpus previsto dal profilo
        if: ${{ success() }}
        timeout-minutes: 14
        run: $COMPARE --part 7
      - name: Aggrega anche risultati parziali
        if: always()
        run: $COMPARE --aggregate
      - name: Conserva prove e risposte effettive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Confronto-${{ matrix.model }}
          path: comparison-artifacts/
          retention-days: 14
          if-no-files-found: error
