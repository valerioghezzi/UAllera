name: Collaudo UAllera

on:
  push:
    branches-ignore: [feature/minerva-runtime, feature/minerva-calibrazione]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          architecture: ${{ matrix.arch }}
      - name: Verifica architettura reale
        shell: python
        run: |
          import platform
          actual=platform.machine().lower()
          expected='${{ matrix.arch }}'
          print('Architecture:',actual,'Python:',platform.python_version())
          assert actual in (['arm64','aarch64'] if expected=='arm64' else ['amd64','x86_64'])
      - name: Prepara tokenizer ufficiale per confronto dei token senza modello
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from tools.prepare_minerva import TOKENIZER, _download
          path=Path('.minerva-tokenizer')/TOKENIZER.name
          _download(path,TOKENIZER,None)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              output.write('UALLERA_OFFICIAL_TOKENIZER='+str(path.resolve())+'\n')
              output.write('UALLERA_TOKENIZER_ORACLE='+str(Path('tests/fixtures/minerva_hf_oracle.json').resolve())+'\n')
      - name: Test senza dipendenze esterne
        run: python -S -m unittest discover -s tests -v
      - name: Test interfaccia nel browser con dati artificiali
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.56.0
          python tools/smoke_browser.py
      - name: Carica motore Minerva nativo senza modello
        if: runner.os == 'Windows'
        shell: python
        run: |
          from pathlib import Path
          import platform, subprocess, sys
          sys.path.insert(0,str(Path.cwd()))
          from tools.prepare_minerva import RUNTIMES, _download, _extract_runtime
          arch='ARM64' if platform.machine().lower() in ('arm64','aarch64') else 'x64'
          root=Path('.minerva-native').resolve(); root.mkdir()
          asset=RUNTIMES[arch]; archive=root/asset.name
          _download(archive,asset,None)
          folder=root/'engine'
          _extract_runtime(root,folder,archive,arch)
          subprocess.run([sys.executable,'tools/inspect_native_imports.py','--directory',str(folder),'--architecture',arch,'--require-static-runtime','--output',str(root/'Imports.json')],check=True,timeout=30)
          result=subprocess.run([str(folder/'llama-server.exe'),'--version'],cwd=folder,capture_output=True,text=True,timeout=30)
          print('Native Minerva engine:',arch,result.stdout,result.stderr)
          assert result.returncode==0
      - name: Inferenza Minerva nativa su testo artificiale
        if: runner.os == 'Windows'
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, platform, sys, time
          sys.path.insert(0,str(Path.cwd()))
          from tools.prepare_minerva import MODEL, RUNTIMES, TOKENIZER, prepare, launch
          from jamovi_audit import local_llm, minerva_review
          arch='ARM64' if platform.machine().lower() in ('arm64','aarch64') else 'x64'
          proof_folder=Path('native-proof');proof_folder.mkdir()
          (proof_folder/'Imports.json').write_bytes(Path('.minerva-native/Imports.json').read_bytes())
          (proof_folder/'Prova_Minerva.json').write_text(json.dumps({'status':'not_completed','scope':'Native transport check did not reach completion.'}),encoding='utf-8')
          before=time.monotonic()
          print('Preparing pinned public assets for native transport check:',arch,flush=True)
          prepared=prepare(Path('.minerva-smoke'),arch)
          text='Una correlazione descrive una associazione, ma da sola non dimostra un rapporto di causa ed effetto.'
          document={'sha256':hashlib.sha256(text.encode()).hexdigest(),'paragraphs':[{'text':text,'location':'Synthetic paragraph 1'}]}
          with launch(prepared) as server:
              config=local_llm.validate_config({'enabled':True,'provider':'llamacpp','endpoint':server.base_url,'model':server.model,'timeout':900,'_managed_minerva':server})
              result=minerva_review.review(document,{},None,config,target_part=6,criterion='Distinguere associazione e causalità: una correlazione da sola non dimostra causalità.')
              assert result['status']=='complete',result['limits']
              assert result['response_count']==1 and result['coverage']['successful_chunks']==1
          assert server.cleanup_complete
          proof={'architecture':arch,'seconds_including_setup':round(time.monotonic()-before,3),'model_sha256':MODEL.sha256,'runtime_sha256':RUNTIMES[arch].sha256,'tokenizer_sha256':TOKENIZER.sha256,'result':result,'scope':'One synthetic CPU inference, authenticated loopback, official input and cleanup. Transport only; no semantic accuracy claim.'}
          (proof_folder/'Prova_Minerva.json').write_text(json.dumps(dict(proof,status='complete'),ensure_ascii=False,indent=2),encoding='utf-8')
          print('Native Minerva transport and cleanup passed:',arch,flush=True)
      - name: Conserva prova nativa del modello
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Minerva-nativo-${{ matrix.arch }}
          path: native-proof/*.json
          retention-days: 14
      - name: Crea pacchetto Windows x64
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        run: python tools/build_windows.py --arch x64
      - name: Crea pacchetto Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        run: python tools/build_windows.py --arch ARM64
      - name: Collauda il runtime portatile nativo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
          $package = Join-Path $PWD "dist/UAllera_Windows_$arch"
          Push-Location $package
          & ./runtime/python.exe -c "import platform; print(platform.machine()); assert platform.machine().lower() in (['arm64','aarch64'] if '$arch'=='ARM64' else ['amd64','x86_64'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./runtime/python.exe -S -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
      - name: Conserva pacchetto collaudato
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: UAllera-${{ matrix.arch }}
          path: dist/*.zip
          retention-days: 14
